x-required-environment: &required-environment
  APP_ENV: ${APP_ENV:?set APP_ENV}
  PROVIDERS_MODE: ${PROVIDERS_MODE:?set PROVIDERS_MODE}
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
  SECURITY_PAGINATION_SECRET: ${SECURITY_PAGINATION_SECRET:?set SECURITY_PAGINATION_SECRET}
  ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?set ENCRYPTION_KEYS}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?set TURNSTILE_SECRET_KEY}
  TURNSTILE_EXPECTED_HOSTNAMES: ${TURNSTILE_EXPECTED_HOSTNAMES:?set TURNSTILE_EXPECTED_HOSTNAMES}
  STORAGE_BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET}
  STORAGE_REGION: ${STORAGE_REGION:-ap-south-1}
  STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-}
  STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-false}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  proxy:
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      MCP_DOMAIN: ${MCP_DOMAIN:?set MCP_DOMAIN}
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256m

  api:
    environment: *required-environment
    image: ${MOTIONILE_API_IMAGE:?set MOTIONILE_API_IMAGE}
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1g

  mcp:
    environment: *required-environment
    image: ${MOTIONILE_API_IMAGE:?set MOTIONILE_API_IMAGE}
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512m

  worker-default:
    environment: *required-environment
    image: ${MOTIONILE_API_IMAGE:?set MOTIONILE_API_IMAGE}
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1g

  worker-render:
    environment: *required-environment
    image: ${MOTIONILE_WORKER_IMAGE:?set MOTIONILE_WORKER_IMAGE}
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 4g

  migrate:
    environment: *required-environment
    image: ${MOTIONILE_API_IMAGE:?set MOTIONILE_API_IMAGE}
    logging: *logging

  redis:
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512m
    volumes:
      - /srv/motionile/data/redis:/data
