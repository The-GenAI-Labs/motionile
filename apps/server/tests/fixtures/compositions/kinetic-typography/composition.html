<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kinetic typography</title>
    <link rel="stylesheet" href="https://runtime.motionile.local/v1/base.css" />
    <style>
      .words {
        margin: 0;
        max-width: 100%;
        text-align: center;
      }
      .word {
        display: inline-block;
        margin-inline: 0.14em;
      }
      .hero {
        font-size: calc(var(--mo-text-title) * 1.3);
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.03em;
      }
      .headline {
        font-size: var(--mo-text-title);
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.02em;
        color: var(--mo-text-secondary);
      }
      .headline .key {
        color: var(--mo-text);
      }
      .closing {
        font-size: calc(var(--mo-text-title) * 1.15);
        font-weight: 800;
        line-height: 1.2;
        letter-spacing: -0.03em;
      }
      .rule {
        width: calc(var(--mo-unit) * 18);
        height: calc(var(--mo-unit) * 0.9);
        margin-top: calc(var(--mo-unit) * 4);
        border-radius: 999px;
        background: var(--mo-accent);
        transform-origin: left center;
      }
    </style>
    <script src="https://runtime.motionile.local/v1/gsap/gsap.min.js"></script>
    <script src="https://runtime.motionile.local/v1/motionile.js"></script>
  </head>
  <body>
    <main class="mo-stage">
      <section class="mo-scene mo-center" data-scene="question">
        <h1 class="words hero" id="question-words"></h1>
        <div class="rule" id="question-rule"></div>
      </section>
      <section class="mo-scene mo-center" data-scene="timing">
        <p class="words headline" id="timing-words"></p>
      </section>
      <section class="mo-scene mo-center" data-scene="close">
        <p class="words closing" id="close-words"></p>
      </section>
    </main>
    <script>
      const REVEAL_SECONDS = 0.35;

      const reveal = (ctx, container, { breakAfterSentence = false } = {}) => {
        const nodes = ctx.words.map((word) => {
          const node = document.createElement("span");
          node.className = "word";
          node.textContent = word.text;
          container.append(node);
          const endsSentence = /[.!?]$/.test(word.text) && word.index < ctx.words.length - 1;
          if (breakAfterSentence && endsSentence) {
            container.append(document.createElement("br"));
          }
          return node;
        });
        nodes.forEach((node, index) => {
          const start = Math.min(ctx.at(index), ctx.duration - REVEAL_SECONDS);
          ctx.timeline.from(
            node,
            { opacity: 0, y: 44, duration: REVEAL_SECONDS, ease: "power3.out" },
            start,
          );
        });
        return nodes;
      };

      Motionile.composition({
        aspects: ["16:9", "9:16", "1:1"],
        scenes: [
          {
            id: "question",
            build(ctx) {
              reveal(ctx, ctx.root.querySelector("#question-words"));
              const rule = ctx.root.querySelector("#question-rule");
              const start = Math.min(ctx.end("question"), ctx.duration - 0.6);
              ctx.timeline.from(
                rule,
                { scaleX: 0, duration: 0.6, ease: "power2.inOut" },
                start,
              );
            },
          },
          {
            id: "timing",
            build(ctx) {
              const nodes = reveal(ctx, ctx.root.querySelector("#timing-words"));
              ["spoken", "picture", "voice"].forEach((target) => {
                const index = ctx.words.findIndex((word) => word.text.toLowerCase().startsWith(target));
                nodes[index].classList.add("key");
              });
            },
          },
          {
            id: "close",
            build(ctx) {
              reveal(ctx, ctx.root.querySelector("#close-words"), { breakAfterSentence: true });
            },
          },
        ],
      });
    </script>
  </body>
</html>
