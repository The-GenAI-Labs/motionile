<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Test video</title>
<link rel="stylesheet" href="https://runtime.motionile.local/v1/base.css">
<style id="mo-style-tokens">html[data-aspect]{--mo-bg:#f7f5ee;--mo-surface:#ffffff;--mo-elevated:#ece8da;--mo-border:#c9c2ae;--mo-text-muted:#5b5b63;--mo-text-secondary:#3d3d45;--mo-text:#17171c;--mo-accent:#1d4ed8;--mo-danger:#c62828;--mo-success:#17703a}</style>
<style data-mo-scene-style="first">
.mo-s-first .title { color: var(--mo-accent); }
.mo-s-first::after { content: '<\/style>'; }
</style>
<style data-mo-scene-style="second">
.mo-s-second {
  display: flex;
  align-items: center;
  justify-content: center;
}
.mo-s-second .mo-fb-stage {
  position: relative;
  width: 100%;
  height: 100%;
}
.mo-s-second .mo-fb-page {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
}
.mo-s-second .mo-fb-title {
  font-size: var(--mo-text-title);
}
.mo-s-second .mo-fb-subtitle {
  font-size: var(--mo-text-subtitle);
}
.mo-s-second .mo-fb-line {
  margin: 0;
  max-width: 100%;
  color: var(--mo-text);
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: -0.01em;
  text-align: center;
  overflow-wrap: anywhere;
}
.mo-s-second .mo-fb-word {
  display: inline-block;
  margin-inline: 0.14em;
}
</style>
<style data-mo-scene-style="third">
@media (min-width: 1px) {
  .mo-s-third .box { opacity: 1; }
}
@keyframes mo-s-third-spin { to { transform: rotate(1turn); } }
</style>
<script src="https://runtime.motionile.local/v1/gsap/gsap.min.js"></script>
<script src="https://runtime.motionile.local/v1/motionile.js"></script>
</head>
<body>
<main class="mo-stage">
<section class="mo-scene mo-s-first" data-scene="first">
<div data-asset="flow"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="fade"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient></defs><circle cx="50" cy="50" r="40" fill="url(#fade)"/></svg></div>
<div data-asset="plain"><svg viewBox="0 0 10 10"><rect width="10" height="10"/></svg></div>
</section>
<section class="mo-scene mo-s-second" data-scene="second">
</section>
<section class="mo-scene mo-s-third" data-scene="third">
<div data-asset="plain"><svg viewBox="0 0 10 10"><rect width="10" height="10"/></svg></div>
</section>
</main>
<script>
Motionile.composition({
  aspects: ["16:9", "1:1"],
  scenes: [
    {
      id: "first",
      build(ctx) {
const marker = "<\/script><\!-- x -->";
ctx.root.dataset.marker = marker;
      },
    },
    {
      id: "second",
      build(ctx) {
const MAX_WORDS = 12;
const MAX_CHARS = 140;
const MAX_WORD_CHARS = 40;
const TITLE_MAX_CHARS = 64;
const REVEAL_SECONDS = 0.3;
const PAGE_IN_SECONDS = 0.12;
const PAGE_OUT_SECONDS = 0.2;
const latest = Math.max(ctx.duration - REVEAL_SECONDS, 0);
const clip = (text) => {
  const letters = Array.from(text);
  return letters.length > MAX_WORD_CHARS ? letters.slice(0, MAX_WORD_CHARS).join("") + "..." : text;
};
const pages = [];
ctx.words.forEach((word) => {
  const text = clip(word.text);
  const page = pages[pages.length - 1];
  if (page && page.words.length < MAX_WORDS && page.chars + 1 + text.length <= MAX_CHARS) {
    page.words.push({ text, index: word.index });
    page.chars += 1 + text.length;
  } else {
    pages.push({ words: [{ text, index: word.index }], chars: text.length });
  }
});
const stage = document.createElement("div");
stage.className = "mo-fb-stage";
ctx.root.append(stage);
const startOf = (page) => Math.min(ctx.at(page.words[0].index), latest);
pages.forEach((page, pageIndex) => {
  const element = document.createElement("div");
  element.className = "mo-fb-page " + (page.chars > TITLE_MAX_CHARS ? "mo-fb-subtitle" : "mo-fb-title");
  const line = document.createElement("p");
  line.className = "mo-fb-line";
  line.dir = "auto";
  element.append(line);
  stage.append(element);
  const first = startOf(page);
  ctx.timeline.fromTo(element, { opacity: 0 }, { opacity: 1, duration: PAGE_IN_SECONDS, ease: "none" }, first);
  page.words.forEach((word) => {
    const node = document.createElement("span");
    node.className = "mo-fb-word";
    node.textContent = word.text;
    line.append(node);
    ctx.timeline.fromTo(
      node,
      { opacity: 0, y: 24 },
      { opacity: 1, y: 0, duration: REVEAL_SECONDS, ease: "power3.out" },
      Math.min(ctx.at(word.index), latest),
    );
  });
  if (pageIndex < pages.length - 1) {
    const next = startOf(pages[pageIndex + 1]);
    const earliest = first + PAGE_IN_SECONDS;
    const fadeStart = Math.min(Math.max(next - PAGE_OUT_SECONDS, earliest), ctx.duration - PAGE_OUT_SECONDS);
    ctx.timeline.fromTo(
      element,
      { opacity: 1 },
      { opacity: 0, duration: PAGE_OUT_SECONDS, ease: "none", immediateRender: false },
      Math.max(fadeStart, 0),
    );
  }
});
      },
    },
    {
      id: "third",
      build(ctx) {
ctx.timeline.to(ctx.root.querySelector('[data-asset="plain"]'), { rotation: 90 }, 0.2);
      },
    },
  ],
});
</script>
</body>
</html>
