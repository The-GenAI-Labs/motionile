packages:
  - apps/web
  - apps/server
  - packages/*
  - tests

strictPeerDependencies: true
autoInstallPeers: false
resolutionMode: highest
linkWorkspacePackages: false
preferWorkspacePackages: true
shamefullyHoist: false

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

overrides:
  js-yaml@>=4.0.0 <4.3.2: 4.3.2

auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
