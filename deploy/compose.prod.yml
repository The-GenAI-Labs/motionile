x-required-environment: &required-environment
  APP_ENV: ${APP_ENV:?set APP_ENV}
  PROVIDERS_MODE: ${PROVIDERS_MODE:?set PROVIDERS_MODE}
  LOG_LEVEL: ${LOG_LEVEL:?set LOG_LEVEL}
  AWS_REGION: ${AWS_REGION:?set AWS_REGION}
  AWS_DEFAULT_REGION: ${AWS_REGION:?set AWS_REGION}
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
  DATABASE_DIRECT_URL: ${DATABASE_DIRECT_URL:?set DATABASE_DIRECT_URL}
  DATABASE_STATEMENT_CACHE_SIZE: ${DATABASE_STATEMENT_CACHE_SIZE:?set DATABASE_STATEMENT_CACHE_SIZE}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
  RATE_LIMIT_ENABLED: "true"
  SECURITY_PAGINATION_SECRET: ${SECURITY_PAGINATION_SECRET:?set SECURITY_PAGINATION_SECRET}
  CATALOG_REVALIDATION_SECRET: ${CATALOG_REVALIDATION_SECRET:?set CATALOG_REVALIDATION_SECRET}
  ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?set ENCRYPTION_KEYS}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?set TURNSTILE_SECRET_KEY}
  TURNSTILE_EXPECTED_HOSTNAMES: ${TURNSTILE_EXPECTED_HOSTNAMES:?set TURNSTILE_EXPECTED_HOSTNAMES}
  STORAGE_BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET}
  STORAGE_REGION: ${STORAGE_REGION:?set STORAGE_REGION}
  STORAGE_ENDPOINT_URL: ""
  STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:?set STORAGE_FORCE_PATH_STYLE}

x-logging: &logging
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION:?set AWS_REGION}
    awslogs-group: ${CLOUDWATCH_LOG_GROUP:?set CLOUDWATCH_LOG_GROUP}
    awslogs-create-group: "false"
    tag: "containers/{{.Name}}"
    mode: non-blocking
    max-buffer-size: 4m

services:
  proxy:
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      MCP_DOMAIN: ${MCP_DOMAIN:?set MCP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/motionile/data/caddy/data:/data
      - /srv/motionile/data/caddy/config:/config
    logging: *logging

  api:
    image: ${MOTIONILE_API_IMAGE:?set MOTIONILE_API_IMAGE}
    environment: *required-environment
    logging: *logging

  mcp:
    image: ${MOTIONILE_API_IMAGE:?set MOTIONILE_API_IMAGE}
    environment: *required-environment
    logging: *logging

  worker-default:
    image: ${MOTIONILE_API_IMAGE:?set MOTIONILE_API_IMAGE}
    environment: *required-environment
    logging: *logging

  worker-render:
    image: ${MOTIONILE_WORKER_IMAGE:?set MOTIONILE_WORKER_IMAGE}
    environment: *required-environment
    logging: *logging

  migrate:
    image: ${MOTIONILE_API_IMAGE:?set MOTIONILE_API_IMAGE}
    environment: *required-environment
    logging: *logging

  redis:
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - /srv/motionile/data/redis:/data
    logging: *logging
