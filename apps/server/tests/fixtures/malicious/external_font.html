<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hostile composition</title>
    <link rel="stylesheet" href="https://runtime.motionile.local/v1/base.css" />
    <script src="https://runtime.motionile.local/v1/gsap/gsap.min.js"></script>
    <script src="https://runtime.motionile.local/v1/motionile.js"></script>
    <style>
      @font-face { font-family: Stolen; src: url("http://__CANARY__/font.woff2"); }
      .mo-title { font-family: Stolen, sans-serif; }
    </style>
  </head>
  <body>
    <main class="mo-stage">
      <section class="mo-scene mo-center" data-scene="main">
        <p class="mo-title">Hello world</p>
      </section>
    </main>
    <script>
      Motionile.composition({
        aspects: ["16:9"],
        scenes: [{ id: "main", build(ctx) {} }],
      });
    </script>
  </body>
</html>
