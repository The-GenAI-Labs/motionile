  RENDER_FPS: ${RENDER_FPS:-}
  RENDER_X264_CRF: ${RENDER_X264_CRF:-}
  RENDER_X264_PRESET: ${RENDER_X264_PRESET:-}
  RENDER_PARALLEL_PAGES: ${RENDER_PARALLEL_PAGES:-}
  RENDER_CHUNK_SECONDS: ${RENDER_CHUNK_SECONDS:-}
  RENDER_SCENE_PADDING_MS: ${RENDER_SCENE_PADDING_MS:-}
  RENDER_TAIL_MS: ${RENDER_TAIL_MS:-}
  RENDER_MAX_DURATION_MS: ${RENDER_MAX_DURATION_MS:-}
  RENDER_POSTER_MS: ${RENDER_POSTER_MS:-}
  RENDER_PAGE_LOAD_TIMEOUT_SECONDS: ${RENDER_PAGE_LOAD_TIMEOUT_SECONDS:-}
  RENDER_READY_TIMEOUT_SECONDS: ${RENDER_READY_TIMEOUT_SECONDS:-}
  RENDER_FRAME_TIMEOUT_SECONDS: ${RENDER_FRAME_TIMEOUT_SECONDS:-}
  RENDER_STAGE_TIMEOUT_SECONDS: ${RENDER_STAGE_TIMEOUT_SECONDS:-}
  RENDER_STALL_SECONDS: ${RENDER_STALL_SECONDS:-}
  RENDER_MIN_FREE_DISK_MB: ${RENDER_MIN_FREE_DISK_MB:-}
  RENDER_BROWSER_MEMORY_MB: ${RENDER_BROWSER_MEMORY_MB:-}
  STORAGE_PUBLIC_ENDPOINT_URL: ${STORAGE_PUBLIC_ENDPOINT_URL:-}
  MEDIA_DELIVERY_MODE: ${MEDIA_DELIVERY_MODE:-presigned}
  MEDIA_COOKIE_DOMAIN: ${MEDIA_COOKIE_DOMAIN:-}
  MEDIA_COOKIE_TTL_SECONDS: ${MEDIA_COOKIE_TTL_SECONDS:-}
  MEDIA_SIGNED_URL_TTL_SECONDS: ${MEDIA_SIGNED_URL_TTL_SECONDS:-}
  CDN_DOMAIN: ${CDN_DOMAIN:-}
  CLOUDFRONT_KEY_PAIR_ID: ${CLOUDFRONT_KEY_PAIR_ID:-}
  AUDIO_TTS_PROVIDER: ${AUDIO_TTS_PROVIDER:-}
  AUDIO_TRANSCRIBER: ${AUDIO_TRANSCRIBER:-}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  ELEVENLABS_API_BASE_URL: ${ELEVENLABS_API_BASE_URL:-}
  ELEVENLABS_TTS_MODEL: ${ELEVENLABS_TTS_MODEL:-}
  ELEVENLABS_STT_MODEL: ${ELEVENLABS_STT_MODEL:-}
  ELEVENLABS_OUTPUT_FORMAT: ${ELEVENLABS_OUTPUT_FORMAT:-}
  ELEVENLABS_COST_MICROS_PER_1K_CHARS: ${ELEVENLABS_COST_MICROS_PER_1K_CHARS:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-}
  OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-}
  OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-}
  OPENAI_COST_MICROS_PER_1K_CHARS: ${OPENAI_COST_MICROS_PER_1K_CHARS:-}
  VOICES_CONSENT_MATCH_THRESHOLD: ${VOICES_CONSENT_MATCH_THRESHOLD:-}
  VOICES_SAMPLE_MIN_TOTAL_SECONDS: ${VOICES_SAMPLE_MIN_TOTAL_SECONDS:-}
  VOICES_SAMPLE_MAX_TOTAL_SECONDS: ${VOICES_SAMPLE_MAX_TOTAL_SECONDS:-}
  VOICES_SAMPLE_MAX_BYTES: ${VOICES_SAMPLE_MAX_BYTES:-}
  VOICES_CONSENT_MIN_SECONDS: ${VOICES_CONSENT_MIN_SECONDS:-}
  VOICES_CONSENT_MAX_SECONDS: ${VOICES_CONSENT_MAX_SECONDS:-}
  VOICES_ATTEMPT_TTL_SECONDS: ${VOICES_ATTEMPT_TTL_SECONDS:-}

x-ai-environment: &ai-environment
  AI_ANTHROPIC_API_KEY: ${AI_ANTHROPIC_API_KEY:-}
  AI_LANGFUSE_PUBLIC_KEY: ${AI_LANGFUSE_PUBLIC_KEY:-}
  AI_LANGFUSE_SECRET_KEY: ${AI_LANGFUSE_SECRET_KEY:-}
  AI_LANGFUSE_HOST: ${AI_LANGFUSE_HOST:-}
  AI_LANGFUSE_PROJECT_ID: ${AI_LANGFUSE_PROJECT_ID:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}

x-cloudfront-signing: &cloudfront-signing
  CLOUDFRONT_PRIVATE_KEY: ${CLOUDFRONT_PRIVATE_KEY:-}

x-hardened: &hardened
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-shared-environment: &shared-environment
  APP_ENV: ${APP_ENV:-local}
  PROVIDERS_MODE: ${PROVIDERS_MODE:-fake}
  DATABASE_URL: ${DATABASE_URL:-postgresql://motionile:motionile@postgres:5432/motionile}
  DATABASE_DIRECT_URL: ${DATABASE_DIRECT_URL:-}
  REDIS_URL: redis://:${REDIS_PASSWORD:-motionile}@redis:6379/0
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-render-worker-environment: &render-worker-environment
  <<: [*media-environment, *shared-environment]
  APP_ROLE: render_worker
  HOME: /tmp
  RENDER_WORK_DIRECTORY: /work

x-server-environment: &server-environment
  <<: [*media-environment, *ai-environment, *cloudfront-signing, *shared-environment]
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  CATALOG_REVALIDATION_SECRET: ${CATALOG_REVALIDATION_SECRET:-}
  BILLING_RAZORPAY_KEY_ID: ${BILLING_RAZORPAY_KEY_ID:-}
  BILLING_RAZORPAY_KEY_SECRET: ${BILLING_RAZORPAY_KEY_SECRET:-}
  BILLING_RAZORPAY_WEBHOOK_SECRET: ${BILLING_RAZORPAY_WEBHOOK_SECRET:-}

x-api-image: &api-image ${MOTIONILE_API_IMAGE:-motionile-api:local}

services:
  proxy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-}
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
      MCP_DOMAIN: ${MCP_DOMAIN:-mcp.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      backend:
        ipv4_address: ${PROXY_IP:-172.30.0.10}
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *hardened
    image: *api-image
    restart: unless-stopped
    environment:
      <<: *server-environment
      FORWARDED_ALLOW_IPS: ${PROXY_IP:-172.30.0.10}
    healthcheck: &http-healthcheck
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy

  mcp:
    <<: *hardened
    image: *api-image
    restart: unless-stopped
    command:
      - uvicorn
      - motionile.entrypoints.mcp:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --no-server-header
    environment:
      <<: *server-environment
      FORWARDED_ALLOW_IPS: ${PROXY_IP:-172.30.0.10}
    healthcheck: *http-healthcheck
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy

  worker-default:
    <<: *hardened
    image: *api-image
    restart: unless-stopped
    command:
      - procrastinate
      - --app=motionile.entrypoints.worker.app
      - worker
      - --queues=default,billing,publishing
      - --concurrency=4
    environment: *server-environment
    stop_grace_period: 60s
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy

  worker-generation:
    <<: *hardened
    image: *api-image
    restart: unless-stopped
    command:
      - procrastinate
      - --app=motionile.entrypoints.worker.app
      - worker
      - --queues=generation
      - --concurrency=4
    environment: *server-environment
    stop_grace_period: 5m
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy

  worker-render:
    image: ${MOTIONILE_WORKER_IMAGE:-motionile-worker:local}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
      - seccomp=seccomp/playwright.json
    pids_limit: 1024
    mem_limit: 6g
    memswap_limit: 6g
    shm_size: 1gb
    tmpfs:
      - /tmp:size=512m,mode=1777,nosuid,nodev
      - /work:size=4g,mode=0700,uid=10001,gid=10001,nosuid,nodev
    environment: *render-worker-environment
    stop_grace_period: 10m
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy

  migrate:
    <<: *hardened
    image: *api-image
    profiles:
      - tools
    command:
      - alembic
      - upgrade
      - head
    environment: *server-environment
    restart: "no"
    networks:
      - backend

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:-motionile}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-motionile}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    networks:
      - backend

networks:
  backend:
    ipam:
      config:
        - subnet: ${BACKEND_SUBNET:-172.30.0.0/24}

volumes:
  caddy-data:
  caddy-config:
  redis-data:
