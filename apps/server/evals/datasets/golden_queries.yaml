    misconceptions:
      - "A smart contract is a legally binding contract by default."
      - "Smart contracts can directly fetch data from websites and external APIs."
    referenceNotes: "A smart contract is a program deployed to a blockchain such as Ethereum. Anyone can call its functions in a transaction, and every node runs the same code and must reach the same result, so the program has to be deterministic. It can hold funds and state, and execution costs gas, a fee that pays for computation. Because of determinism, a contract cannot call a website directly; it relies on oracles to supply outside data such as prices. The name comes from computer scientist Nick Szabo in the 1990s. A smart contract is code, not a legal agreement by default, and bugs in the code can be costly because deployed code is hard to change."
  - id: tech-web3-04
    subcategory: blockchain-and-web3
    query: "What are layer two rollups and how do optimistic and zero-knowledge rollups differ?"
    durationSeconds: 75
    aspects: ["16:9"]
    language: en
    keyConcepts:
      - {
          name: "execute transactions off layer one",
          synonyms: ["off-chain execution", "batching"],
        }
      - {
          name: "post compressed data to layer one",
          synonyms: ["data availability", "inherit security of layer one"],
        }
      - {
          name: "optimistic rollups use fraud proofs",
          synonyms: ["challenge period", "assume valid unless challenged"],
        }
      - {
          name: "zero-knowledge rollups use validity proofs",
          synonyms: ["ZK proofs", "proof verified on layer one"],
        }
      - { name: "lower fees and higher throughput", synonyms: ["cheaper transactions", "scaling"] }
    misconceptions:
      - "Rollups are independent blockchains with their own separate security."
      - "Optimistic rollups use zero-knowledge proofs to verify transactions."
    referenceNotes: "A rollup processes many transactions off the main chain, layer one, and posts compressed transaction data and a commitment to the new state back to layer one. Because the data and the verification live on layer one, a rollup inherits its security and spreads the cost of one layer-one transaction over many users, giving lower fees. Optimistic rollups assume batches are valid and allow a challenge period, commonly around a week, in which anyone can submit a fraud proof. Zero-knowledge rollups post a cryptographic validity proof that layer one verifies, so withdrawals do not need a long challenge window. Both approaches aim to scale throughput without weakening decentralization."
  - id: tech-security-01
    subcategory: cybersecurity
    query: "How does SQL injection work, and how do developers prevent it?"
    durationSeconds: 75
    aspects: ["16:9"]
    language: en
    keyConcepts:
      - {
          name: "untrusted input is concatenated into a query",
          synonyms: ["string building of SQL", "user input becomes code"],
        }
      - {
          name: "input changes the structure of the query",
          synonyms: ["injected SQL syntax", "data treated as commands"],
        }
      - {
          name: "parameterized queries separate code from data",
          synonyms: ["prepared statements", "bind variables"],
        }
      - {
          name: "least privilege database accounts",
          synonyms: ["limited permissions", "reduce impact"],
        }
      - { name: "validation as a secondary defense", synonyms: ["input validation", "allow lists"] }
    misconceptions:
      - "Manually escaping quote characters is the best and sufficient defense."
      - "SQL injection only affects login forms."
    referenceNotes: "SQL injection happens when an application builds an SQL statement by concatenating untrusted input, so an attacker's text is interpreted as SQL syntax and changes the meaning of the query, possibly exposing or altering data. Any place that feeds input into a query is exposed, including search boxes, URL parameters and headers, not only login forms. The primary defense is parameterized queries, or prepared statements, where the SQL text is fixed and values are sent separately, so input is always treated as data. Defense in depth adds database accounts with least privilege, allow-list validation, and an ORM used safely. Hand-written escaping is error-prone and not a substitute for parameterization."
  - id: tech-security-02
    subcategory: cybersecurity
    query: "What is cross-site scripting and how do I stop it?"
    durationSeconds: 60
    aspects: ["16:9", "9:16"]
    language: en
    keyConcepts:
      - {
          name: "attacker-controlled script runs in the victim's browser",
          synonyms: ["script injection", "runs in the site's origin"],
        }
      - {
          name: "stored, reflected and DOM-based XSS",
          synonyms: ["types of XSS", "persistent and non-persistent"],
        }
      - { name: "output encoding by context", synonyms: ["escaping HTML", "safe templating"] }
      - { name: "Content Security Policy", synonyms: ["CSP", "restrict script sources"] }
      - { name: "HttpOnly cookies limit theft", synonyms: ["cookie flags", "session protection"] }
    misconceptions:
      - "XSS attacks the web server directly rather than the users' browsers."
      - "Serving the site over HTTPS prevents XSS."
    referenceNotes: "Cross-site scripting occurs when a site includes untrusted input in a page without proper handling, so an attacker's script runs in a victim's browser with the privileges of the vulnerable site's origin. It can read page content, act as the user or, if cookies are not protected, steal them. Stored XSS saves the payload on the server, reflected XSS sends it in a request that is echoed back, and DOM-based XSS happens in client-side code. The main defense is encoding output for the context it appears in, using frameworks that escape by default. A Content Security Policy and HttpOnly cookies reduce the damage. HTTPS protects traffic in transit and does not prevent XSS."
  - id: tech-security-03
    subcategory: cybersecurity
    query: "How should passwords be stored? What are hashing and salting?"
    durationSeconds: 60
    aspects: ["16:9"]
    language: en
    keyConcepts:
      - { name: "hashing is one-way", synonyms: ["cannot be decrypted", "hash function"] }
      - {
          name: "salt is unique per password",
          synonyms: ["random value", "defeats rainbow tables"],
        }
      - { name: "slow, memory-hard password hashes", synonyms: ["bcrypt", "scrypt", "Argon2"] }
      - {
          name: "never store plaintext passwords",
          synonyms: ["breach impact", "verify by hashing the attempt"],
        }
    misconceptions:
      - "Hashing and encryption are the same thing, so a hash can be decrypted."
      - "A fast general-purpose hash like SHA-256 alone is ideal for storing passwords."
      - "The salt must be kept secret like a key."
    referenceNotes: "A site should never store a password itself. It stores the output of a one-way hash function, and at login hashes the attempt and compares. Unlike encryption, a hash cannot be reversed with a key. A random salt, unique per user and stored with the hash, makes identical passwords hash differently and defeats precomputed rainbow tables; the salt need not be secret. General-purpose hashes such as SHA-256 are very fast, which helps attackers guess billions of passwords per second, so passwords use deliberately slow, tunable algorithms such as bcrypt, scrypt or Argon2, the winner of the Password Hashing Competition in 2015. Breaches then reveal much less."
  - id: tech-security-04
    subcategory: cybersecurity
    query: "How do phishing attacks work and how can I spot one?"
    durationSeconds: 45
    aspects: ["9:16", "16:9"]
    language: en
    keyConcepts:
      - {
          name: "impersonation of a trusted sender",
          synonyms: ["spoofed email", "fake bank or company"],
        }
      - { name: "urgency and fear", synonyms: ["pressure tactics", "social engineering"] }
      - {
          name: "lookalike links and fake login pages",
          synonyms: ["typosquatting", "credential harvesting"],
        }
      - {
          name: "defenses",
          synonyms: ["multi-factor authentication", "passkeys", "check the sender and URL"],
        }
    misconceptions:
      - "Phishing only happens through email."
      - "A padlock and HTTPS in the address bar prove a site is legitimate."
    referenceNotes: "Phishing is a social engineering attack in which someone impersonates a trusted party to trick you into revealing credentials, paying money or installing malware. Messages often create urgency or fear, such as claiming your account will be locked, and contain links to lookalike domains and fake login pages that capture what you type. It happens through email, text messages, phone calls and social media, not only email. A padlock only shows an encrypted connection, and attackers can get certificates for their own sites. Useful defenses are checking the real domain, going to the site directly, multi-factor authentication, and phishing-resistant passkeys that will not work on a fake domain."
  - id: tech-security-05
    subcategory: cybersecurity
    query: "What is zero trust security? Is it a product I can buy?"
    durationSeconds: 60
    aspects: ["16:9"]
    language: en
    keyConcepts:
      - { name: "never trust, always verify", synonyms: ["no implicit trust", "assume breach"] }
      - {
          name: "verify identity, device and context on every request",
          synonyms: ["continuous verification", "conditional access"],
        }
      - { name: "least privilege access", synonyms: ["minimal permissions", "just enough access"] }
      - {
          name: "network location does not grant trust",
          synonyms: ["beyond the perimeter", "microsegmentation"],
        }
    misconceptions:
      - "Zero trust is a single product that you can buy and install."
      - "Zero trust means nobody is trusted, so nobody gets access to anything."
    referenceNotes: "Zero trust is a security model, not a single product. Instead of trusting everything inside a corporate network perimeter, it assumes a breach is possible and treats every request as untrusted until verified. Each access decision checks who the user is, the health of the device and the context, such as location and sensitivity of the resource, and grants only the least privilege needed for that task, often for a short time. Techniques include strong authentication, device posture checks, microsegmentation of the network, and continuous monitoring. NIST describes it in Special Publication 800-207. Users still get access, but it is granted per request according to policy."
