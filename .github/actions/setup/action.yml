name: Set up toolchain
description: Install Node.js, pnpm, uv and the project dependencies.
inputs:
  python:
    description: Install the Python environment for apps/server.
    required: false
    default: "true"
  render:
    description: Install the render dependency group, ffmpeg and Chromium for the server project.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6.1.0
    - uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - name: Install Node.js dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - uses: astral-sh/setup-uv@v10.3.2
      if: inputs.python == 'true'
      with:
        version: "0.13.0"
        enable-cache: true
        cache-dependency-glob: apps/server/uv.lock
    - name: Install Python dependencies
      if: inputs.python == 'true'
      shell: bash
      run: uv sync --frozen --project apps/server
    - name: Install ffmpeg
      if: inputs.python == 'true' && inputs.render == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends ffmpeg
    - name: Allow the Chromium sandbox on the runner
      if: inputs.python == 'true' && inputs.render == 'true'
      shell: bash
      run: sudo sysctl --ignore --write kernel.apparmor_restrict_unprivileged_userns=0
    - name: Install Chromium
      if: inputs.python == 'true' && inputs.render == 'true'
      shell: bash
      run: uv run --frozen --no-sync --project apps/server playwright install --with-deps chromium
