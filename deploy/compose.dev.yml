x-server-build: &server-build
  context: ../apps/server
  dockerfile: Dockerfile
  target: api

x-dev-storage: &dev-storage
  STORAGE_ENDPOINT_URL: http://minio:9000
  STORAGE_PUBLIC_ENDPOINT_URL: http://localhost:9000
  STORAGE_BUCKET: motionile-local
  STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-motionile}
  STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-motionile-dev-secret}
  NOTIFICATIONS_SMTP_HOST: mailpit
  MEDIA_DELIVERY_MODE: presigned

services:
  proxy:
    profiles:
      - proxy

  api:
    build: *server-build
    image: motionile-api:local
    command:
      - uvicorn
      - motionile.entrypoints.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
      - --no-server-header
    environment:
      <<: *dev-storage
      FORWARDED_ALLOW_IPS: "*"
      PYTHONPATH: /app/src
      AUTH_WEB_ORIGIN: ${AUTH_WEB_ORIGIN:-http://localhost:3000}
      AUTH_API_ORIGIN: ${AUTH_API_ORIGIN:-https://localhost:8000}
      AUTH_TEST_ACCESS_SECONDS: ${AUTH_TEST_ACCESS_SECONDS:-900}
    ports:
      - "8000:8000"
    volumes:
      - ../apps/server/src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy

  mcp:
    build: *server-build
    image: motionile-api:local
    environment:
      <<: *dev-storage
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker-default:
    build: *server-build
    image: motionile-api:local
    environment: *dev-storage
    depends_on:
      postgres:
        condition: service_healthy

  worker-render:
    build:
      <<: *server-build
      target: worker
    image: motionile-worker:local
    environment: *dev-storage
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build: *server-build
    image: motionile-api:local
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    ports:
      - "6379:6379"

  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: motionile
      POSTGRES_PASSWORD: motionile
      POSTGRES_DB: motionile
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motionile -d motionile"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-motionile}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-motionile-dev-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:v1.31.5
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - backend

volumes:
  postgres-data:
  minio-data:
