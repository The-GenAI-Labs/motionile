name: Start application stack
description: Build and start the development Compose stack, run migrations and optionally serve a production build of the web app.
inputs:
  services:
    description: Space-separated application services to start after migrations.
    required: false
    default: api mcp
  web:
    description: Build and serve the web app on port 3000.
    required: false
    default: "true"
  browser-auth:
    description: Serve the browser stack over local HTTPS with a short test access lifetime.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Configure catalog revalidation
      shell: bash
      run: echo 'CATALOG_REVALIDATION_SECRET=motionile-ci-catalog-revalidation-secret' >> "$GITHUB_ENV"
    - name: Configure browser authentication
      if: inputs.browser-auth == 'true'
      shell: bash
      run: |
        echo 'APP_ENV=ci' >> "$GITHUB_ENV"
        echo 'CORS_ALLOWED_ORIGINS=http://localhost:3000,https://localhost:3443' >> "$GITHUB_ENV"
        echo 'AUTH_WEB_ORIGIN=https://localhost:3443' >> "$GITHUB_ENV"
        echo 'AUTH_API_ORIGIN=https://localhost:3443' >> "$GITHUB_ENV"
        echo 'AUTH_TEST_ACCESS_SECONDS=75' >> "$GITHUB_ENV"
    - name: Allow the Chromium sandbox in containers
      if: contains(inputs.services, 'worker-render')
      shell: bash
      run: sudo sysctl --ignore --write kernel.apparmor_restrict_unprivileged_userns=0
    - name: Build server images
      shell: bash
      run: docker compose -f deploy/compose.yml -f deploy/compose.dev.yml build api ${{ contains(inputs.services, 'worker-render') && 'worker-render' || '' }}
    - name: Start data services
      shell: bash
      run: docker compose -f deploy/compose.yml -f deploy/compose.dev.yml up --detach --wait postgres redis minio
    - name: Run migrations
      shell: bash
      run: docker compose -f deploy/compose.yml -f deploy/compose.dev.yml run --rm migrate
    - name: Seed catalog
      shell: bash
      run: docker compose -f deploy/compose.yml -f deploy/compose.dev.yml run --rm api python -m motionile.scripts.seed_catalog
    - name: Seed sample products
      shell: bash
      run: docker compose -f deploy/compose.yml -f deploy/compose.dev.yml run --rm api python -m motionile.scripts.seed_products --env ci
    - name: Seed and activate system prompts for fake providers
      shell: bash
      run: docker compose -f deploy/compose.yml -f deploy/compose.dev.yml run --rm api python -m motionile.scripts.seed_prompts --bootstrap-fake-providers
    - name: Seed system skills for fake providers
      shell: bash
      run: docker compose -f deploy/compose.yml -f deploy/compose.dev.yml run --rm api python -m motionile.scripts.seed_skills
    - name: Start application services
      shell: bash
      run: docker compose -f deploy/compose.yml -f deploy/compose.dev.yml up --detach --no-build --wait --wait-timeout 180 ${{ inputs.services }}
    - name: Build web app
      if: inputs.web == 'true'
      shell: bash
      env:
        API_INTERNAL_URL: http://127.0.0.1:8000
        NEXT_PUBLIC_SITE_URL: ${{ inputs.browser-auth == 'true' && 'https://localhost:3443' || 'http://localhost:3000' }}
        NEXT_PUBLIC_API_URL: ${{ inputs.browser-auth == 'true' && 'https://localhost:3443' || 'http://localhost:8000' }}
        NEXT_PUBLIC_JWKS_URL: http://127.0.0.1:8000/v1/auth/jwks.json
        NEXT_PUBLIC_PROVIDERS_MODE: fake
        NEXT_PUBLIC_MEDIA_ORIGIN: http://localhost:9000
      run: pnpm --filter @motionile/web build
    - name: Serve web app
      if: inputs.web == 'true'
      shell: bash
      env:
        API_INTERNAL_URL: http://127.0.0.1:8000
        NODE_ENV: production
        PORT: "3000"
        HOSTNAME: 127.0.0.1
        NEXT_PUBLIC_SITE_URL: ${{ inputs.browser-auth == 'true' && 'https://localhost:3443' || 'http://localhost:3000' }}
        NEXT_PUBLIC_API_URL: ${{ inputs.browser-auth == 'true' && 'https://localhost:3443' || 'http://localhost:8000' }}
        NEXT_PUBLIC_JWKS_URL: http://127.0.0.1:8000/v1/auth/jwks.json
        NEXT_PUBLIC_PROVIDERS_MODE: fake
      run: |
        cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
        nohup node apps/web/.next/standalone/apps/web/server.js > web-server.log 2>&1 &
        curl --silent --fail --retry 30 --retry-connrefused --retry-delay 2 http://127.0.0.1:3000/api/health
    - name: Wait for the API
      shell: bash
      run: curl --silent --fail --retry 30 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/health/ready
    - name: Serve browser HTTPS
      if: inputs.browser-auth == 'true'
      shell: bash
      run: |
        certificate_directory="$(mktemp -d)"
        openssl req -x509 -newkey rsa:2048 -nodes -keyout "$certificate_directory/key.pem" -out "$certificate_directory/cert.pem" -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
        nohup node tests/support/https-proxy.mjs "$certificate_directory" > https-proxy.log 2>&1 &
        curl --insecure --silent --fail --retry 30 --retry-connrefused --retry-delay 2 https://localhost:3443/api/health
